<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trolley Label &amp; Calibration Register</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--tx:#1a1d21;--mut:#6b7280;--bd:#d9dde3;--ac:#0b5cab;--red:#c8102e;--amb:#b45309;--grn:#15803d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1e2227;--tx:#eceff3;--mut:#9aa3af;--bd:#343a42;--ac:#5aa2e8;--red:#ff6b7f;--amb:#f0b24a;--grn:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1e2227;--tx:#eceff3;--mut:#9aa3af;--bd:#343a42;--ac:#5aa2e8;--red:#ff6b7f;--amb:#f0b24a;--grn:#4ade80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:760px;margin:0 auto}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.banner{border-left:4px solid var(--red);padding:8px 10px;background:var(--card);border-radius:8px;margin-bottom:10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 140px}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
button.d{color:var(--red)}
.item{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.item:first-child{border-top:0}
.item img,.ph{width:56px;height:42px;object-fit:cover;border-radius:6px;background:var(--bd);flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:600}
.s{font-size:12px;color:var(--mut)}
.b{font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.b.o{color:var(--red)}.b.w{color:var(--amb)}.b.k{color:var(--grn)}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.acts button{padding:5px 9px;font-size:13px}
textarea{width:100%;height:90px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);padding:8px;font:12px monospace}
details summary{cursor:pointer;color:var(--mut);font-size:13px}
#printArea{display:none}
.lbl{width:277mm;padding:8mm 10mm;margin:0 auto;color:#000;font-family:Arial,sans-serif;display:flex;flex-direction:column;break-after:page;page-break-after:always;-webkit-print-color-adjust:exact;print-color-adjust:exact;background-color:#fff}
.lbl.hasph{height:188mm}
.lbl:last-child{break-after:auto;page-break-after:auto}
.lbl .tt{font-size:30pt;font-weight:700;text-align:center;border-bottom:2px solid #c8102e;padding-bottom:3mm}
.lbl .tt.sm{font-size:20pt}
.lbl .im{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding:4mm 0;overflow:hidden}
.lbl .im img{max-width:70%;max-height:100%;min-height:0;object-fit:contain;border:1px solid #000}
.lbl .im .noimg{height:60mm;line-height:60mm;color:#888;border:1px dashed #888}
.lbl .g{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:3mm 6mm;border-top:2px solid #c8102e;padding-top:4mm;margin-top:4mm;font-size:12pt}
.lbl:not(.hasph){height:188mm;justify-content:center}
.lbl:not(.hasph) .g{border-top:0;margin-top:22mm}
.lbl .g>div:nth-child(6){grid-column:1/3;text-align:center}
.lbl .g>div:nth-child(7){grid-column:3}
.lbl .g>div:nth-child(8){grid-column:4/6;text-align:center}
.lbl .g span{text-decoration:underline;margin-right:1mm}
@media print{
 body>*:not(#printArea){display:none!important}
 html,body{padding:0;margin:0;max-width:none;width:auto;background:#fff}
 :root{padding:0;color-scheme:light}
 #printArea{display:block}
 #printArea .lbl{background-color:#fff!important;color:#000!important}
 #printArea .lbl *{color:#000!important}
 @page{size:A4 landscape;margin:10mm}
 .pt .lbl,.pt .lbl.hasph,.pt .lbl:not(.hasph){width:190mm;height:auto;padding:6mm}
 .pt .lbl .tt{font-size:22pt}.pt .lbl .tt.sm{font-size:16pt}.pt .lbl .im{flex:none}.pt .lbl .im img{max-width:100%;max-height:115mm}.pt .lbl .g{grid-template-columns:1fr 1fr;font-size:11pt}.pt .lbl .g>div:nth-child(n){grid-column:auto;text-align:left}.pt .lbl:not(.hasph) .g{margin-top:10mm}
}
</style>
</head>
<body>
<h1>Trolley Label &amp; Calibration Register</h1>
<div id="alerts"></div>

<div class="card" id="formCard">
 <div class="row" style="margin-bottom:8px"><div style="flex:2 1 280px"><label>Trolley name (print header)</label><input id="nm" placeholder="EMM Plate Storage trolley"></div></div>
 <div class="row">
  <div><label>Trolley No</label><input id="no" placeholder="GIS/02"></div>
  <div><label>Location</label><select id="locS"><option>PA 1</option><option>PA 2</option><option>PA 3</option><option>PA 4</option><option>MT 1</option><option>MT 2</option><option>MT 3</option><option>MT 4</option><option>MT 5</option><option>MT 6</option><option>MT 7</option><option>MT 8</option><option>MT 9</option><option>Manual</option></select><input id="loc" placeholder="Type location" style="display:none;margin-top:6px"></div>
  <div><label>Department</label><select id="deptS"><option>Assembly</option><option>Testing</option><option>Stores</option><option>Manual</option></select><input id="dept" placeholder="Type department" style="display:none;margin-top:6px"></div>
 </div>
 <div class="row" style="margin-top:8px">
  <div><label>Trolley type</label><select id="type"><option>Jigs &amp; Fixtures</option><option>Material</option><option>Tools</option><option>WIP</option><option>Other</option></select></div>
  <div><label>Max capacity</label><input id="cap" placeholder="4"></div>
  <div><label>Product</label><input id="prod" placeholder="ELK3/ELK04"></div>
 </div>
 <div class="row" style="margin-top:8px">
  <div><label>Calibration due date</label><input id="due" type="date"></div>
  <div><label>Person responsible</label><input id="per" placeholder="Name"></div>
  <div><label>Photo (optional)</label><input id="photo" type="file" accept="image/*"></div>
 </div>
 <div class="acts" style="margin-top:10px">
  <button class="p" id="saveBtn">Save trolley</button>
  <button id="clearBtn">Clear</button>
 </div>
</div>

<div class="card">
 <div class="row" style="align-items:end">
  <div style="flex:2"><label>Search</label><input id="q" placeholder="Trolley no, product, person…"></div>
  <div style="flex:0 0 auto"><button class="p" id="printAll">Print all</button></div>
 </div>
 <div id="list" style="margin-top:8px"></div>
</div>

<div class="card">
 <details><summary>Backup / restore</summary>
  <p class="s">Copy this text and keep it safe. To restore, paste it and tap Restore.</p>
  <textarea id="bk"></textarea>
  <div class="acts"><button id="bkRefresh">Refresh</button><button id="bkRestore">Restore</button></div>
 </details>
</div>

<div id="printArea"></div>

<script>
(function(){
var KEY='trolleys_v1',items=[],editId=null,photoData='';
function load(){try{var r=localStorage.getItem(KEY);if(r){items=JSON.parse(r)||[];return}}catch(e){}
 items=[{id:'seed1',nm:'EMM Plate Storage trolley',no:'GIS/02',loc:'PA 2',dept:'Assembly',type:'Jigs & Fixtures',cap:'4',prod:'ELK3/ELK04',due:'2026-01-31',per:'Sarang Modi',photo:''}]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function days(d){if(!d)return null;var t=new Date();t.setHours(0,0,0,0);var x=new Date(d+'T00:00:00');return Math.round((x-t)/864e5)}
function fmt(d){if(!d)return '-';var p=d.split('-');return p[2]+'.'+p[1]+'.'+p[0].slice(2)}
function status(d){var n=days(d);if(n===null)return{c:'w',t:'No date'};if(n<0)return{c:'o',t:'Overdue '+(-n)+'d'};if(n<=30)return{c:'w',t:'Due in '+n+'d'};return{c:'k',t:'OK'}}
function alerts(){var bad=items.filter(function(i){var n=days(i.due);return n!==null&&n<=30}).sort(function(a,b){return days(a.due)-days(b.due)});
 $('alerts').innerHTML=bad.length?'<div class="banner"><b>'+bad.length+' trolley(s) need calibration</b><br>'+bad.map(function(i){return esc(i.no)+' — '+status(i.due).t}).join('<br>')+'</div>':'';
 return bad}
function render(){var q=$('q').value.toLowerCase(),h='';
 items.filter(function(i){return !q||(i.no+i.prod+i.per+i.loc).toLowerCase().indexOf(q)>-1}).forEach(function(i){var s=status(i.due);
  h+='<div class="item">'+(i.photo?'<img src="'+i.photo+'" alt="">':'<div class="ph"></div>')+'<div class="grow"><div class="t">'+esc(i.no)+' <span class="b '+s.c+'">'+s.t+'</span></div><div class="s">'+esc(i.loc)+' · '+esc(i.type)+' · '+esc(i.prod)+' · Due '+fmt(i.due)+' · '+esc(i.per)+'</div><div class="acts"><button data-a="p" data-i="'+i.id+'">Print label</button><button data-a="e" data-i="'+i.id+'">Edit</button><button class="d" data-a="x" data-i="'+i.id+'">Delete</button></div></div></div>'});
 $('list').innerHTML=h||'<div class="s">No trolleys yet.</div>';alerts();$('bk').value=JSON.stringify(items.map(function(i){var c=Object.assign({},i);delete c.photo;return c}))}
function label(i){return '<div class="lbl'+(i.photo?' hasph':'')+'"><div class="tt'+((i.nm||'').length>38?' sm':'')+'">'+esc(i.nm||('Trolley '+i.no))+'</div>'+(i.photo?'<div class="im"><img src="'+i.photo+'" alt=""></div>':'')+'<div class="g"><div><span>Trolley location</span>: '+esc(i.loc)+'</div><div><span>Department</span>: '+esc(i.dept)+'</div><div><span>Trolley type</span>: '+esc(i.type)+'</div><div><span>Maximum Capacity</span>: '+esc(i.cap)+'</div><div><span>Trolley No</span>: '+esc(i.no)+'</div><div><span>Product</span>: '+esc(i.prod)+'</div><div><span>Calibration due date</span>: '+fmt(i.due)+'</div><div><span>Person Responsible</span>: '+esc(i.per)+'</div></div></div>'}
function doPrint(list){var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);$('printArea').className=ios?'pt':'';var de=document.documentElement;de.setAttribute('data-theme','light');window.addEventListener('afterprint',function(){de.removeAttribute('data-theme')},{once:true});$('printArea').innerHTML=list.map(label).join('');setTimeout(function(){try{window.print()}catch(e){alert('Print blocked here — open the link in a full browser tab and try again.')}},150)}
function clearForm(){editId=null;photoData='';['no','nm','loc','dept','cap','prod','due','per'].forEach(function(k){$(k).value=''});$('locS').value='PA 1';$('deptS').value='Assembly';tog();$('photo').value='';$('saveBtn').textContent='Save trolley'}
$('photo').onchange=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var m=900,s=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7)};im.src=r.result};r.readAsDataURL(f)};
$('saveBtn').onclick=function(){if(!$('no').value.trim()){alert('Trolley No daalo');return}
 var o={id:editId||('t'+Date.now()),no:$('no').value.trim(),nm:$('nm').value.trim(),loc:gv('locS','loc'),dept:gv('deptS','dept'),type:$('type').value,cap:$('cap').value.trim(),prod:$('prod').value.trim(),due:$('due').value,per:$('per').value.trim(),photo:photoData};
 if(editId){var k=items.findIndex(function(x){return x.id===editId});if(!photoData)o.photo=items[k].photo;items[k]=o}else items.unshift(o);
 save();clearForm();render()};
$('clearBtn').onclick=clearForm;
$('q').oninput=render;
$('printAll').onclick=function(){doPrint(items)};
$('list').onclick=function(e){var b=e.target.closest('button');if(!b)return;var id=b.getAttribute('data-i'),it=items.find(function(x){return x.id===id});
 if(b.getAttribute('data-a')==='p')doPrint([it]);
 if(b.getAttribute('data-a')==='x'&&confirm('Delete '+it.no+'?')){items=items.filter(function(x){return x.id!==id});save();render()}
 if(b.getAttribute('data-a')==='e'){editId=id;photoData='';$('no').value=it.no;$('nm').value=it.nm||'';pick($('locS'),$('loc'),it.loc);pick($('deptS'),$('dept'),it.dept);$('type').value=it.type;$('cap').value=it.cap;$('prod').value=it.prod;$('due').value=it.due;$('per').value=it.per;$('saveBtn').textContent='Update trolley';window.scrollTo(0,0)}};
function tog(){$('loc').style.display=$('locS').value==='Manual'?'':'none';$('dept').style.display=$('deptS').value==='Manual'?'':'none'}
function gv(s,t){return $(s).value==='Manual'?$(t).value.trim():$(s).value}
function pick(s,t,v){var f=[].some.call(s.options,function(x){return x.value===v&&v!=='Manual'});if(f){s.value=v;t.value=''}else{s.value='Manual';t.value=v}tog()}
$('locS').onchange=tog;$('deptS').onchange=tog;
$('bkRefresh').onclick=render;
$('bkRestore').onclick=function(){try{var a=JSON.parse($('bk').value);if(!Array.isArray(a))throw 0;items=a;save();render()}catch(e){alert('Invalid backup text')}};
load();render();
try{if('Notification' in window){var bad=alerts();if(bad.length){var go=function(){try{new Notification('Calibration due',{body:bad.length+' trolley(s) due/overdue: '+bad.slice(0,3).map(function(i){return i.no}).join(', ')})}catch(e){}};
 if(Notification.permission==='granted')go();else if(Notification.permission==='default')Notification.requestPermission().then(function(p){if(p==='granted')go()}).catch(function(){})}}}catch(e){}
})();
</script>
</body>
</html>
